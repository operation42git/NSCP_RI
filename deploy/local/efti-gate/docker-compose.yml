services:
  rabbitmq:
    image: rabbitmq:3-management
    container_name: efti-rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    volumes:
      - ./rabbitmq/rabbitmq.conf:/etc/rabbitmq/rabbitmq.conf
      - ./rabbitmq/rabbitmq-defs.json:/etc/rabbitmq/definitions.json
    ports:
      - "5672:5672"
      - "15672:15672"
    networks:
      efti:

  platform-ACME:
    image: eclipse-temurin:17-jdk
    depends_on:
      - keycloak
      - psql
    environment:
      - TMPDIR=/usr/src/myapp/tmp
      - CATALINA_TMPDIR=/usr/src/myapp/tmp
    volumes:
      - ./platform:/usr/src/myapp
    working_dir: /usr/src/myapp
    command: java -Xmx1024m -Xms512m -agentlib:jdwp=transport=dt_socket,server=y,suspend=n,address=*:5005 -jar -Dspring.config.location=file:application.yml -Dspring.profiles.active=ACME platform-simulator.jar --port=8070
    ports:
      - "8070:8070"
      - "8893:5005"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      efti:

  platform-MASSIVE:
    image: eclipse-temurin:17-jdk
    depends_on:
      - keycloak
      - psql
    volumes:
      - ./platform:/usr/src/myapp
    working_dir: /usr/src/myapp
    command: java -Xmx1024m -Xms512m -agentlib:jdwp=transport=dt_socket,server=y,suspend=n,address=*:5005 -jar -Dspring.config.location=file:application.yml -Dspring.profiles.active=MASSIVE platform-simulator.jar --port=8071
    ports:
      - "8071:8071"
      - "8894:5005"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      efti:
  
  platform-UMBRELLA:
    image: eclipse-temurin:17-jdk
    depends_on:
      - keycloak
      - psql
    volumes:
      - ./platform:/usr/src/myapp
    working_dir: /usr/src/myapp
    command: java -Xmx1024m -Xms512m -agentlib:jdwp=transport=dt_socket,server=y,suspend=n,address=*:5005 -jar -Dspring.config.location=file:application.yml -Dspring.profiles.active=UMBRELLA platform-simulator.jar --port=8072
    ports:
      - "8072:8072"
      - "8895:5005"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      efti:

  efti-gate-HR:
    env_file:
      - ./gate/ENV/HR.env
    image: eclipse-temurin:17-jdk
    depends_on:
      - keycloak
      - psql
    volumes:
      - ./gate:/usr/src/myapp
    working_dir: /usr/src/myapp
    command: sh -c "exec java -Xmx2048m -Xms1024m -agentlib:jdwp=transport=dt_socket,server=y,suspend=n,address=*:5005 -Dspring.config.location=/usr/src/myapp/ -Dspring.profiles.active=$${PROFILE} -jar efti-gate.jar"
    ports:
      - "8880:8880"
      - "8890:5005"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      efti:

  efti-gate-AT:
    env_file:
      - ./gate/ENV/AT.env
    image: eclipse-temurin:17-jdk
    depends_on:
      - keycloak
      - psql
    volumes:
      - ./gate:/usr/src/myapp
    working_dir: /usr/src/myapp
    command: sh -c "exec java -Xmx2048m -Xms1024m -agentlib:jdwp=transport=dt_socket,server=y,suspend=n,address=*:5005 -Dspring.config.location=/usr/src/myapp/ -Dspring.profiles.active=$${PROFILE} -jar efti-gate.jar"
    ports:
      - "8881:8881"
      - "8891:5005"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      efti:

  efti-gate-SLO:
    env_file:
      - ./gate/ENV/SLO.env
    image: eclipse-temurin:17-jdk
    depends_on:
      - keycloak
      - psql
    volumes:
      - ./gate:/usr/src/myapp
    working_dir: /usr/src/myapp
    command: sh -c "exec java -Xmx2048m -Xms1024m -agentlib:jdwp=transport=dt_socket,server=y,suspend=n,address=*:5005 -Dspring.config.location=/usr/src/myapp/ -Dspring.profiles.active=$${PROFILE} -jar efti-gate.jar"
    ports:
      - "8882:8882"
      - "8892:5005"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      efti:

  psql:
    image: postgres:15.4
    container_name: reference-gate-shared-db
    environment:
      POSTGRES_PASSWORD: root
      POSTGRES_DB: efti
    ports:
      - "9001:5432"
    volumes:
      - ./sql:/docker-entrypoint-initdb.d
    networks:
      efti:

  psql-meta:
    image: postgres:15.4
    environment:
      POSTGRES_PASSWORD: root
      POSTGRES_DB: efti
    ports:
      - "5433:5432"
    volumes:
      - ./sql-meta:/docker-entrypoint-initdb.d
    networks:
      efti:

  keycloak:
    image: quay.io/keycloak/keycloak:22.0.5
    command: [ "start-dev", "--import-realm", "-Dkeycloak.profile.feature.upload_scripts=enabled" ]
    environment:
      - KEYCLOAK_ADMIN=admin
      - KEYCLOAK_ADMIN_PASSWORD=secret
      - DEBUG=true
      - DEBUG_PORT=*:8788
    ports:
      - "8080:8080"
      - "8788:8788"
    volumes:
      - ./keycloak/hr-export.json:/opt/keycloak/data/import/hr-export.json
      - ./keycloak/at-export.json:/opt/keycloak/data/import/at-export.json
      - ./keycloak/slo-export.json:/opt/keycloak/data/import/slo-export.json
    networks:
      efti:
        aliases:
          - auth.gate.croatia.eu
          - auth.gate.slovenia.eu
          - auth.gate.austria.eu

  # Apache
  apache:
    container_name: apache
    image: bellackn/httpd_oidc
    ports:
      - "83:83"
    volumes:
      - ./httpd/config/httpd.conf:/usr/local/apache2/conf/httpd.conf
      - ./httpd/config/conf.d:/usr/local/apache2/conf.d
      - ./httpd/config/gate-router.lua:/usr/local/apache2/conf/gate-router.lua
    networks:
      efti:
    extra_hosts:
      - "host.docker.internal:host-gateway"

networks:
  efti:
    name: efti-network
    external: true
