<!DOCTYPE html>
<html lang="hr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>eFTI HR01 - Kompletan Pregled sa Svim Podacima</title>
    <style>
        :root {
            --ink: #1f2937;
            --muted: #6b7280;
            --line: #e5e7eb;
            --paper: #ffffff;
            --bg: #f9fafb;
            --accent: #2563eb;
            --accent-light: rgba(37, 99, 235, 0.1);
            --success: #059669;
            --warning: #d97706;
            --danger: #dc2626;
            --border-radius: 8px;
            --shadow: 0 1px 3px 0 rgba(0, 0, 0, 0.1);
            --shadow-lg: 0 10px 15px -3px rgba(0, 0, 0, 0.1);
        }

        * { box-sizing: border-box; }

        body {
            margin: 0;
            padding: 0;
            font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
            background: var(--bg);
            color: var(--ink);
            font-size: 14px;
            line-height: 1.5;
        }

        .container {
            display: flex;
            flex-direction: column;
            height: 100vh;
        }

        /* HEADER - OSNOVNI PODACI */
        .header-basic {
            background: white;
            border-bottom: 1px solid var(--line);
            padding: 20px 24px;
            box-shadow: var(--shadow);
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .header-basic h1 {
            margin: 0 0 12px 0;
            font-size: 22px;
            font-weight: 700;
        }

        .basic-info-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 16px;
        }

        .info-item {
            display: flex;
            gap: 12px;
            padding: 12px;
            background: var(--bg);
            border-radius: 6px;
            border-left: 3px solid var(--accent);
        }

        .info-label {
            font-size: 11px;
            color: var(--muted);
            text-transform: uppercase;
            font-weight: 600;
            min-width: 100px;
        }

        .info-value {
            font-size: 13px;
            font-weight: 600;
            color: var(--ink);
        }

        /* MAIN CONTENT */
        .main-layout {
            display: flex;
            flex: 1;
            gap: 0;
            overflow: hidden;
        }

        .sidebar {
            width: 280px;
            background: var(--paper);
            border-right: 1px solid var(--line);
            overflow-y: auto;
            padding: 16px 0;
        }

        .sidebar-title {
            padding: 0 16px 12px;
            font-size: 11px;
            font-weight: 700;
            color: var(--muted);
            text-transform: uppercase;
            letter-spacing: 0.05em;
            border-bottom: 1px solid var(--line);
            margin-bottom: 12px;
        }

        .group-section {
            margin-bottom: 16px;
        }

        .group-section h3 {
            margin: 0 0 8px 16px;
            font-size: 12px;
            font-weight: 600;
            color: var(--ink);
            padding-top: 8px;
        }

        .group-section:first-child h3 {
            padding-top: 0;
        }

        .group-item {
            padding: 8px 16px;
            cursor: pointer;
            color: var(--muted);
            transition: all 0.2s;
            border-left: 3px solid transparent;
            font-size: 12px;
        }

        .group-item:hover {
            background: var(--bg);
            color: var(--ink);
        }

        .group-item.active {
            background: var(--accent-light);
            color: var(--accent);
            border-left-color: var(--accent);
            font-weight: 600;
        }

        .content {
            flex: 1;
            overflow-y: auto;
            padding: 24px;
            background: var(--bg);
        }

        .cards-container {
            display: grid;
            grid-template-columns: 1fr;
            gap: 20px;
        }

        .card {
            background: white;
            border: 1px solid var(--line);
            border-radius: var(--border-radius);
            overflow: hidden;
            box-shadow: var(--shadow);
        }

        .card-header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 16px;
            border-bottom: 1px solid rgba(0,0,0,0.1);
        }

        .card-header h2 {
            margin: 0;
            font-size: 16px;
            font-weight: 700;
        }

        .card-header p {
            margin: 4px 0 0 0;
            font-size: 12px;
            opacity: 0.85;
        }

        .card-body {
            padding: 16px;
        }

        .card-body h3 {
            margin: 0 0 12px 0;
            font-size: 13px;
            font-weight: 600;
            color: var(--ink);
        }

        .fields {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
            gap: 12px;
        }

        .field {
            padding: 12px;
            background: var(--bg);
            border: 1px solid var(--line);
            border-radius: 6px;
        }

        .field-name {
            font-size: 12px;
            font-weight: 600;
            color: var(--ink);
            margin-bottom: 4px;
        }

        .field-id {
            font-family: 'Courier New', monospace;
            font-size: 10px;
            color: var(--accent);
            font-weight: 600;
            margin-bottom: 4px;
        }

        .field-desc {
            font-size: 11px;
            color: var(--muted);
            line-height: 1.4;
            padding: 8px;
            background: white;
            border-radius: 3px;
            border-left: 2px solid var(--warning);
        }

        .stats {
            display: flex;
            gap: 16px;
            padding: 12px 0;
            font-size: 12px;
            color: var(--muted);
        }

        .stat {
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .stat-value {
            font-weight: 600;
            color: var(--accent);
        }

        @media (max-width: 1024px) {
            .main-layout {
                flex-direction: column;
            }

            .sidebar {
                width: 100%;
                max-height: 150px;
                border-right: none;
                border-bottom: 1px solid var(--line);
            }

            .fields {
                grid-template-columns: 1fr;
            }
        }

        @media (max-width: 640px) {
            .header-basic {
                padding: 12px 16px;
            }

            .header-basic h1 {
                font-size: 18px;
            }

            .basic-info-grid {
                grid-template-columns: 1fr;
            }

            .content {
                padding: 12px;
            }

            .card-header {
                padding: 12px;
            }

            .card-body {
                padding: 12px;
            }
        }
    </style>
</head>

            <div id="cards-map"></div>

        <!-- CONTENT SA SVIM KARTICAMA -->
        <main class="content" id="content"></main>
    </div>
</div>

function renderAll() {
    renderSidebar();
    renderContent();
    updateStats();
}

function updateStats() {
    const groups = [...new Set(cardsData.map(c => c.group))];
    const totalFields = cardsData.reduce((sum, c) => sum + (c.fields?.length || 0), 0);
    
    document.getElementById("statsGroups").textContent = groups.length;
    document.getElementById("statsCards").textContent = cardsData.length;
    document.getElementById("statsFields").textContent = totalFields;
}

function renderSidebar() {
    const grouped = {};
    cardsData.forEach(card => {
        if (!grouped[card.group]) grouped[card.group] = [];
        grouped[card.group].push(card);
    });

    let html = '';
    for (const [groupName, groupCards] of Object.entries(grouped)) {
        html += `<div class="group-section">`;
        html += `<h3>${groupName}</h3>`;
        groupCards.forEach(card => {
            const isActive = cardsData[currentCardIdx].id === card.id ? 'active' : '';
            const cardIdx = cardsData.indexOf(card);
            html += `<div class="group-item ${isActive}" onclick="scrollToCard(${cardIdx})">${card.name}</div>`;
        });
        html += `</div>`;
    }
    document.getElementById("cards-map").innerHTML = html;
}

function scrollToCard(idx) {
    currentCardIdx = idx;
    const cardEl = document.getElementById('card-' + cardsData[idx].id);
    if (cardEl) {
        cardEl.scrollIntoView({ behavior: 'smooth', block: 'start' });
    }
    renderSidebar();
}

                                    <div class="field-name">${field.name}</div>
                                    <div class="field-id">${field.id}</div>
                                    <div class="field-desc">${field.definition}</div>
                                </div>
                            `).join('')}
                        </div>
                        
                        ${advFields.length ? `
                            <h3 style="margin-top: 16px;">Napredni Podaci (${advFields.length})</h3>
                            <div class="fields">
                                ${advFields.map(field => `
                                    <div class="field">
                                        <div class="field-name">${field.name}</div>
                                        <div class="field-id">${field.id}</div>
                                        <div class="field-desc">${field.definition}</div>
                                    </div>
                                `).join('')}
                            </div>
                        ` : ''}
                    </div>
                </div>
            `;
        });
    }

    document.getElementById("content").innerHTML = html;
}

// ========== INIT ==========
renderAll();
</script>
</body>
</html>
